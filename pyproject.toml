[project]
name = "mcp-db-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eXor6orks", email = "batmoon19@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
mcp-db-server = "mcp_db_server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
